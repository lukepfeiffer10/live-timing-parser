[package]
name = "live-timing-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
log = "0.4.34"
reqwest = { version = "0.13", features = ["json", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.20"
warp = { version = "0.4", features = ["server"] }

